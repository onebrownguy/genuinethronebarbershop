<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Roster | Genuine Throne (Staff)</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/assets/images/logo.png">
  <style>
    :root{--green:#9ACD32;--gold:#C8952A;--black:#0a0a0a;--panel:#151515;--white:#f5f5f0;--muted:rgba(255,255,255,.66);--red:#e0533d}
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:var(--black);color:var(--white);font-family:'Barlow',system-ui,-apple-system,sans-serif;padding:20px;max-width:760px;margin:0 auto}
    header{text-align:center;margin-bottom:20px}
    .logo{width:52px;height:52px;margin-bottom:8px}
    h1{font-size:19px;text-transform:uppercase;letter-spacing:2px}
    .sub{color:var(--muted);font-size:13px;margin-top:4px}
    .today{background:var(--panel);border:1px solid rgba(154,205,50,.25);border-radius:8px;padding:14px;text-align:center;margin-bottom:18px}
    .today-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
    .today-value{font-size:17px;font-weight:700;margin-top:5px}
    .wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
    table{width:100%;border-collapse:collapse;min-width:560px}
    th,td{padding:10px 6px;text-align:center;border-bottom:1px solid rgba(255,255,255,.1)}
    th{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:700}
    th.name,td.name{text-align:left;white-space:nowrap;font-weight:700;font-size:14px;padding-right:12px}
    th.is-today{color:var(--green)}
    td.is-today{background:rgba(154,205,50,.07)}
    input[type=checkbox]{width:22px;height:22px;accent-color:var(--green);cursor:pointer}
    .actions{display:flex;gap:10px;align-items:center;margin-top:20px;flex-wrap:wrap}
    button{padding:13px 22px;font-size:15px;font-weight:700;border:none;border-radius:6px;cursor:pointer;font-family:inherit}
    .save{background:var(--green);color:#0a0a0a}
    .ghost{background:transparent;border:1px solid rgba(255,255,255,.25);color:var(--white);padding:12px 16px;font-size:13px}
    .pinrow{margin-top:22px;padding-top:18px;border-top:1px solid rgba(255,255,255,.12)}
    label.lbl{display:block;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
    input[type=password]{width:100%;padding:12px;font-size:16px;background:var(--panel);border:1px solid rgba(255,255,255,.2);border-radius:6px;color:var(--white);font-family:inherit}
    .row{display:flex;gap:8px}
    .row input{flex:1}
    #msg{margin-top:14px;padding:11px;border-radius:6px;font-size:14px;text-align:center;display:none}
    #msg.ok{display:block;background:rgba(154,205,50,.15);color:var(--green)}
    #msg.err{display:block;background:rgba(224,83,61,.15);color:var(--red)}
    .note{margin-top:18px;font-size:12px;color:var(--muted);line-height:1.6;text-align:center}
    a{color:var(--green)}
    th.hrs,td.hrs{white-space:nowrap;padding-left:14px}
    input.tm{background:var(--panel);border:1px solid rgba(255,255,255,.2);border-radius:4px;color:var(--white);font-family:inherit;font-size:13px;padding:5px 6px;width:98px}
  </style>
</head>
<body>
  <header>
    <img class="logo" src="/assets/images/logo.png" alt="">
    <h1>Weekly Roster</h1>
    <div class="sub">Who normally works each day &middot; set once, changes rarely</div>
  </header>

  <div class="today">
    <div class="today-label">Showing on site today</div>
    <div class="today-value" id="today">Loading&hellip;</div>
  </div>

  <div class="wrap">
    <table id="grid">
      <thead><tr id="head"></tr></thead>
      <tbody id="body"></tbody>
    </table>
  </div>

  <div class="actions">
    <button class="save" id="save" type="button">Save roster</button>
    <button class="ghost" id="reload" type="button">Discard changes</button>
  </div>

  <div id="msg"></div>

  <div class="pinrow">
    <label class="lbl" for="pin">Staff code</label>
    <div class="row">
      <input id="pin" type="password" autocomplete="current-password" placeholder="Enter staff code">
      <button class="ghost" id="savepin" type="button">Save</button>
    </div>
  </div>

  <p class="note">
    This is the normal weekly schedule, not today&rsquo;s wait.
    For &ldquo;can I walk in right now&rdquo;, use <a href="/status">the walk-in status page</a>.
  </p>

<script>
(function () {
  var TOKEN_KEY = 'gt_staff_token';
  var DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var msg = document.getElementById('msg');
  var head = document.getElementById('head');
  var body = document.getElementById('body');
  var pin = document.getElementById('pin');
  var state = { barbers: [], days: {}, dayIndex: null };

  function token() {
    try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; }
  }

  function failureText(status) {
    if (location.protocol === 'file:') return 'Open this from the website, not a saved file';
    if (navigator.onLine === false)    return 'No internet connection - reconnect and retry';
    if (status)                        return 'Server error (' + status + ') - try again shortly';
    return 'Cannot reach the server - check your signal';
  }

  function say(text, ok) {
    msg.textContent = text;
    msg.className = ok ? 'ok' : 'err';
    clearTimeout(say.timer);
    say.timer = setTimeout(function () { msg.className = ''; }, 4500);
  }

  function render(d) {
    state.barbers = d.barbers || [];
    state.days = d.days || {};
    state.dayIndex = d.dayIndex;

    document.getElementById('today').textContent = d.hasRoster
      ? d.dayName + ': ' + d.working.map(function (w) { return w.name; }).join(', ')
      : d.dayName + ': nobody set yet';

    head.textContent = '';
    var th0 = document.createElement('th');
    th0.className = 'name';
    th0.textContent = 'Barber';
    head.appendChild(th0);
    DAYS.forEach(function (name, i) {
      var th = document.createElement('th');
      th.textContent = name;
      if (i === d.dayIndex) th.className = 'is-today';
      head.appendChild(th);
    });
    var thHours = document.createElement('th');
    thHours.textContent = 'Hours (optional)';
    thHours.className = 'hrs';
    head.appendChild(thHours);

    body.textContent = '';
    state.barbers.forEach(function (b) {
      var tr = document.createElement('tr');
      var td0 = document.createElement('td');
      td0.className = 'name';
      td0.textContent = b.name;
      tr.appendChild(td0);

      DAYS.forEach(function (_, i) {
        var td = document.createElement('td');
        if (i === d.dayIndex) td.className = 'is-today';
        var cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.dataset.barber = b.key;
        cb.dataset.day = String(i);
        cb.checked = Array.isArray(state.days[b.key]) && state.days[b.key].indexOf(i) !== -1;
        cb.setAttribute('aria-label', b.name + ' works ' + DAYS[i]);
        td.appendChild(cb);
        tr.appendChild(td);
      });

      // Optional per-barber hours. Blank means "same as shop hours (10-8)".
      var h = (d.hours && d.hours[b.key]) || null;
      var tdH = document.createElement('td');
      tdH.className = 'hrs';
      var start = document.createElement('input');
      start.type = 'time';
      start.className = 'tm';
      start.dataset.barber = b.key;
      start.dataset.edge = 'start';
      start.value = h ? h.start : '';
      start.setAttribute('aria-label', b.name + ' start time');
      var dash = document.createElement('span');
      dash.textContent = ' – ';
      var end = document.createElement('input');
      end.type = 'time';
      end.className = 'tm';
      end.dataset.barber = b.key;
      end.dataset.edge = 'end';
      end.value = h ? h.end : '';
      end.setAttribute('aria-label', b.name + ' end time');
      tdH.appendChild(start); tdH.appendChild(dash); tdH.appendChild(end);
      tr.appendChild(tdH);

      body.appendChild(tr);
    });
  }

  function load() {
    fetch('/api/roster', { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) { var e = new Error('http'); e.status = r.status; throw e; }
        return r.json();
      })
      .then(render)
      .catch(function (e) {
        document.getElementById('today').textContent = failureText(e && e.status);
      });
  }

  function collect() {
    var days = {};
    state.barbers.forEach(function (b) { days[b.key] = []; });
    Array.prototype.forEach.call(document.querySelectorAll('#body input[type=checkbox]'), function (cb) {
      if (cb.checked) days[cb.dataset.barber].push(Number(cb.dataset.day));
    });
    return days;
  }

  function collectHours() {
    var hours = {};
    Array.prototype.forEach.call(document.querySelectorAll("#body input.tm"), function (inp) {
      if (!inp.value) return;
      var k = inp.dataset.barber;
      hours[k] = hours[k] || {};
      hours[k][inp.dataset.edge] = inp.value;
    });
    // Only send complete start+end pairs; the API drops half-formed ones anyway.
    Object.keys(hours).forEach(function (k) {
      if (!hours[k].start || !hours[k].end) delete hours[k];
    });
    return hours;
  }

  document.getElementById('savepin').addEventListener('click', function () {
    var v = pin.value.trim();
    if (!v) return;
    try { localStorage.setItem(TOKEN_KEY, v); } catch (e) {}
    pin.value = '';
    say('Staff code saved on this device', true);
  });

  document.getElementById('reload').addEventListener('click', function () { load(); say('Reloaded from the site', true); });

  document.getElementById('save').addEventListener('click', function () {
    var t = token();
    if (!t) { say('Enter your staff code below first', false); return; }
    var btn = this;
    btn.disabled = true;

    fetch('/api/roster', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'authorization': 'Bearer ' + t },
      body: JSON.stringify({ days: collect(), hours: collectHours() })
    })
      .then(function (r) {
        var err;
        if (r.status === 401) { err = new Error('Wrong staff code - nothing was saved'); err.handled = true; throw err; }
        if (!r.ok) { err = new Error('Not saved - server error (' + r.status + ')'); err.handled = true; throw err; }
        return r.json();
      })
      .then(function () { say('Roster saved - the site is showing this now', true); load(); })
      .catch(function (e) { say(e && e.handled ? e.message : 'Not saved - ' + failureText(), false); })
      .then(function () { btn.disabled = false; });
  });

  load();
})();
</script>
</body>
</html>
