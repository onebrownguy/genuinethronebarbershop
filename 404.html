<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Genuine Throne Barbershop</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/assets/images/logo.png">
  <!-- Self-contained: styles are inlined so this page renders correctly no
       matter what unmatched path Cloudflare serves it for. -->
  <style>
    :root {
      --green: #9ACD32; --gold: #C8952A; --black: #0a0a0a; --white: #f5f5f0;
      --muted: rgba(255,255,255,0.66);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--black); color: var(--white);
      font-family: 'Barlow', system-ui, -apple-system, sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 24px;
    }
    .wrap { max-width: 520px; }
    .logo { width: 88px; height: 88px; margin-bottom: 28px; }
    .code {
      font-family: 'Bebas Neue', 'Barlow Condensed', sans-serif;
      font-size: clamp(88px, 22vw, 160px); line-height: 0.9; letter-spacing: 2px;
      background: linear-gradient(135deg, var(--green), var(--gold));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    h1 {
      font-family: 'Barlow Condensed', sans-serif; text-transform: uppercase;
      letter-spacing: 3px; font-size: 22px; margin: 8px 0 14px;
    }
    p { color: var(--muted); font-size: 15px; line-height: 1.6; margin-bottom: 32px; }
    .btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    a.btn {
      display: inline-block; text-decoration: none; font-weight: 600;
      font-family: 'Barlow Condensed', sans-serif; text-transform: uppercase;
      letter-spacing: 1px; font-size: 15px; padding: 13px 28px; border-radius: 4px;
    }
    .btn-primary { background: linear-gradient(135deg, var(--green), var(--gold)); color: #0a0a0a; }
    .btn-outline { border: 1px solid rgba(255,255,255,0.3); color: var(--white); }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="/assets/images/logo.png" alt="Genuine Throne Barbershop">

       Esa pagina no existe. Vuelve al inicio o reserva tu cita.</p>
